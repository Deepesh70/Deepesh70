name: Draw git-koi

on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/koi.yml'

jobs:
  koi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Koi
        uses: yalongwastaken/git-koi@v1
        with:
          login: ${{ github.repository_owner }}
          body: asagi
          output-dir: assets/koi

      - name: Commit generated koi GIF if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/koi/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: tend the koi [skip ci]" && git push)
