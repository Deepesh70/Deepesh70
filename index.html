<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deepesh — Profile</title>
  <!-- Tailwind Play CDN for quick prototyping -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome for icons -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body class="bg-gray-50 text-slate-800">
  <main class="max-w-3xl mx-auto p-6">
    <header class="text-center mb-8">
      <h1 class="text-4xl font-extrabold">Deepesh</h1>
      <p class="mt-2 text-gray-600">Web Dev, AI & ML, Game Dev</p>
      <div class="mt-4 flex justify-center gap-3 text-gray-500">
        <a href="#" class="hover:text-sky-600"><i class="fab fa-github fa-lg"></i></a>
        <a href="#" class="hover:text-sky-600"><i class="fab fa-linkedin fa-lg"></i></a>
        <a href="#" class="hover:text-sky-600"><i class="fab fa-twitter fa-lg"></i></a>
      </div>
    </header>

    <section class="bg-white rounded-lg shadow p-6 mb-6">
      <h2 class="text-2xl font-semibold mb-2">About Me</h2>
      <p class="text-gray-700">Student at Indian Institute of Information Technology, Surat, Gujarat</p>
    </section>

    <section class="mb-6">
      <h2 class="text-2xl font-semibold mb-4">Technologies</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="bg-white p-4 rounded shadow">
          <h3 class="font-semibold">AI & ML</h3>
          <div class="mt-2 flex flex-wrap gap-2">
            <span class="text-sm bg-gray-100 px-2 py-1 rounded">PyTorch</span>
            <span class="text-sm bg-gray-100 px-2 py-1 rounded">TensorFlow</span>
            <span class="text-sm bg-gray-100 px-2 py-1 rounded">OpenCV</span>
          </div>
        </div>
        <div class="bg-white p-4 rounded shadow">
          <h3 class="font-semibold">Scripting & Tools</h3>
          <div class="mt-2 flex flex-wrap gap-2">
            <span class="text-sm bg-gray-100 px-2 py-1 rounded">Bash</span>
            <span class="text-sm bg-gray-100 px-2 py-1 rounded">NPM</span>
            <span class="text-sm bg-gray-100 px-2 py-1 rounded">Git</span>
          </div>
        </div>
      </div>
    </section>

    <section class="bg-white p-4 rounded shadow mb-6">
      <h2 class="text-2xl font-semibold mb-4">Projects</h2>
      <div class="grid sm:grid-cols-2 gap-4">
        <a href="#" class="block p-4 border rounded hover:shadow">
          <h3 class="font-semibold">Wedding_Web</h3>
          <p class="text-sm text-gray-600">Contribution</p>
        </a>
        <a href="#" class="block p-4 border rounded hover:shadow">
          <h3 class="font-semibold">GGStats</h3>
          <p class="text-sm text-gray-600">Stats dashboard</p>
        </a>
      </div>
    </section>

    <footer class="text-center text-sm text-gray-500 mt-8">
      Built with Tailwind • <a href="Readme.md" class="text-sky-600 hover:underline">README</a>
    </footer>
  </main>
</body>
</html>
