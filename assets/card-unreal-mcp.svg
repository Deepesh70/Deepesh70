      <text class="mono" x="108" y="16" text-anchor="middle" font-size="11" fill="#c9d1d9">Unreal Engine</text>

      <rect x="168" width="56" height="24" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text class="mono" x="196" y="16" text-anchor="middle" font-size="11" fill="#c9d1d9">MCP</text>

      <rect x="232" width="84" height="24" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text class="mono" x="274" y="16" text-anchor="middle" font-size="11" fill="#c9d1d9">TypeScript</text>
