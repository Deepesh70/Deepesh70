<svg width="480" height="212" viewBox="0 0 480 212" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Unreal-MCP: Model Context Protocol host for Unreal Engine">
  <defs>
    <linearGradient id="bgg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1222"/><stop offset="1" stop-color="#141b33"/></linearGradient>
    <linearGradient id="topg1" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
    <linearGradient id="swg1" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="cpg1"><rect width="480" height="212" rx="18"/></clipPath>
  </defs>
  <style>
    text{font-family:'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace}
    .sweep{animation:sweep 10s ease-in-out 2s infinite}
    @keyframes sweep{0%{transform:translateX(-220px) skewX(-18deg)}35%,100%{transform:translateX(560px) skewX(-18deg)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#cpg1)">
    <rect width="480" height="212" fill="url(#bgg1)"/>
    <rect width="480" height="3" fill="url(#topg1)"/>
    <rect class="sweep" x="0" y="0" width="150" height="212" fill="url(#swg1)"/>
    <rect x="24" y="26" width="46" height="46" rx="13" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-opacity=".45"/>
    <text class="mono" x="47" y="55" text-anchor="middle" font-size="16" font-weight="700" fill="#22d3ee">{ }</text>
    <text x="84" y="46" font-size="22" font-weight="700" fill="#f1f5f9">Unreal-MCP</text>
    <text x="84" y="65" font-size="13" fill="#94a3b8">Model Context Protocol host for Unreal Engine</text>
    <text x="24" y="108" font-size="13.5" fill="#cbd5e1">C++ bindings let LLM agents drive the editor: viewport,</text>
    <text x="24" y="128" font-size="13.5" fill="#cbd5e1">actor transforms and scene assets over low-latency IPC.</text>
    <rect x="24" y="160" width="46" height="26" rx="13.0" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".38"/><text class="mono" x="47.0" y="177.2" text-anchor="middle" font-size="12" fill="#22d3ee">C++</text>
    <rect x="78" y="160" width="118" height="26" rx="13.0" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".38"/><text class="mono" x="137.0" y="177.2" text-anchor="middle" font-size="12" fill="#22d3ee">Unreal Engine</text>
    <rect x="204" y="160" width="46" height="26" rx="13.0" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".38"/><text class="mono" x="227.0" y="177.2" text-anchor="middle" font-size="12" fill="#22d3ee">MCP</text>
    <rect x="258" y="160" width="96" height="26" rx="13.0" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".38"/><text class="mono" x="306.0" y="177.2" text-anchor="middle" font-size="12" fill="#22d3ee">TypeScript</text>
  </g>
  <rect x=".5" y=".5" width="479" height="211" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity=".10"/>
</svg>
