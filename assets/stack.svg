<svg width="1000" height="330" viewBox="0 0 1000 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Technical stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1222"/><stop offset="1" stop-color="#141b33"/></linearGradient>
    <linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="cp"><rect width="1000" height="330" rx="18"/></clipPath>
  </defs>
  <style>
    text{font-family:'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace}
    .sweep{animation:sweep 14s ease-in-out infinite}
    @keyframes sweep{0%{transform:translateX(-300px) skewX(-18deg)}40%,100%{transform:translateX(1200px) skewX(-18deg)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
