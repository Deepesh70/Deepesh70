    <rect x="304" y="34" width="67" height="26" rx="13.0" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".38"/><text class="mono" x="337.5" y="51.2" text-anchor="middle" font-size="12" fill="#a78bfa">Python</text>
