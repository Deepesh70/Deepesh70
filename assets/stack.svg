<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Technical stack">
  <defs>
    <clipPath id="cp_stack"><rect width="1000" height="260" rx="10"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  </style>

  <g clip-path="url(#cp_stack)">
    <rect width="1000" height="260" fill="#0d1117"/>
    <rect x="0" y="0" width="1000" height="1" fill="#30363d"/>

    <!-- Row 1: Languages -->
    <text class="mono" x="32" y="44" font-size="13" font-weight="600" fill="#f0f6fc">Languages</text>
    <g transform="translate(240, 26)">
      <rect width="48" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/><text class="mono" x="24" y="17" text-anchor="middle" font-size="12" fill="#c9d1d9">C++</text>
      <rect x="56" width="68" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/><text class="mono" x="90" y="17" text-anchor="middle" font-size="12" fill="#c9d1d9">Python</text>
      <rect x="132" width="94" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/><text class="mono" x="179" y="17" text-anchor="middle" font-size="12" fill="#c9d1d9">TypeScript</text>
      <rect x="234" width="94" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/><text class="mono" x="281" y="17" text-anchor="middle" font-size="12" fill="#c9d1d9">JavaScript</text>
      <rect x="336" width="48" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/><text class="mono" x="360" y="17" text-anchor="middle" font-size="12" fill="#c9d1d9">SQL</text>
    </g>
    <line x1="32" y1="68" x2="968" y2="68" stroke="#21262d" stroke-width="1"/>

    <!-- Row 2: Systems & AI -->
    <text class="mono" x="32" y="104" font-size="13" font-weight="600" fill="#f0f6fc">Systems &amp; AI</text>
    <g transform="translate(240, 86)">
      <rect width="108" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/><text class="mono" x="54" y="17" text-anchor="middle" font-size="12" fill="#00BFFF">Unreal Engine</text>
      <rect x="116" width="56" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/><text class="mono" x="144" y="17" text-anchor="middle" font-size="12" fill="#00BFFF">MCP</text>
      <rect x="180" width="72" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/><text class="mono" x="216" y="17" text-anchor="middle" font-size="12" fill="#c9d1d9">PyTorch</text>
      <rect x="260" width="56" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/><text class="mono" x="288" y="17" text-anchor="middle" font-size="12" fill="#c9d1d9">CUDA</text>
      <rect x="324" width="72" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/><text class="mono" x="360" y="17" text-anchor="middle" font-size="12" fill="#c9d1d9">Docker</text>
      <rect x="404" width="58" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/><text class="mono" x="433" y="17" text-anchor="middle" font-size="12" fill="#c9d1d9">Linux</text>
    </g>
    <line x1="32" y1="128" x2="968" y2="128" stroke="#21262d" stroke-width="1"/>

    <!-- Row 3: Backend & Storage -->
    <text class="mono" x="32" y="164" font-size="13" font-weight="600" fill="#f0f6fc">Backend &amp; Storage</text>
    <g transform="translate(240, 146)">
      <rect width="68" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/><text class="mono" x="34" y="17" text-anchor="middle" font-size="12" fill="#c9d1d9">FastAPI</text>
      <rect x="76" width="68" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/><text class="mono" x="110" y="17" text-anchor="middle" font-size="12" fill="#c9d1d9">Node.js</text>
      <rect x="152" width="68" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/><text class="mono" x="186" y="17" text-anchor="middle" font-size="12" fill="#c9d1d9">Express</text>
      <rect x="228" width="94" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/><text class="mono" x="275" y="17" text-anchor="middle" font-size="12" fill="#c9d1d9">PostgreSQL</text>
      <rect x="330" width="80" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/><text class="mono" x="370" y="17" text-anchor="middle" font-size="12" fill="#c9d1d9">MongoDB</text>
      <rect x="418" width="58" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/><text class="mono" x="447" y="17" text-anchor="middle" font-size="12" fill="#c9d1d9">Redis</text>
    </g>
    <line x1="32" y1="188" x2="968" y2="188" stroke="#21262d" stroke-width="1"/>

    <!-- Row 4: Core CS -->
    <text class="mono" x="32" y="224" font-size="13" font-weight="600" fill="#f0f6fc">Core Foundations</text>
    <g transform="translate(240, 206)">
      <rect width="48" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/><text class="mono" x="24" y="17" text-anchor="middle" font-size="12" fill="#c9d1d9">DSA</text>
      <rect x="56" width="48" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/><text class="mono" x="80" y="17" text-anchor="middle" font-size="12" fill="#c9d1d9">OOP</text>
      <rect x="112" width="138" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/><text class="mono" x="181" y="17" text-anchor="middle" font-size="12" fill="#c9d1d9">Operating Systems</text>
      <rect x="258" width="48" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/><text class="mono" x="282" y="17" text-anchor="middle" font-size="12" fill="#c9d1d9">IPC</text>
      <rect x="314" width="118" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/><text class="mono" x="373" y="17" text-anchor="middle" font-size="12" fill="#c9d1d9">System Design</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="999" height="259" rx="9.5" fill="none" stroke="#30363d" stroke-width="1"/>
</svg>
