<svg width="480" height="212" viewBox="0 0 480 212" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ScholarDive: Adaptive assessment platform, co-builder">
  <defs>
    <linearGradient id="bgg0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1222"/><stop offset="1" stop-color="#141b33"/></linearGradient>
    <linearGradient id="topg0" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity="0"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
    <linearGradient id="swg0" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="cpg0"><rect width="480" height="212" rx="18"/></clipPath>
  </defs>
  <style>
    text{font-family:'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace}
    .sweep{animation:sweep 10s ease-in-out 0s infinite}
    @keyframes sweep{0%{transform:translateX(-220px) skewX(-18deg)}35%,100%{transform:translateX(560px) skewX(-18deg)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#cpg0)">
    <rect width="480" height="212" fill="url(#bgg0)"/>
    <rect width="480" height="3" fill="url(#topg0)"/>
    <rect class="sweep" x="0" y="0" width="150" height="212" fill="url(#swg0)"/>
    <rect x="24" y="26" width="46" height="46" rx="13" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".45"/>
    <text class="mono" x="47" y="55" text-anchor="middle" font-size="16" font-weight="700" fill="#a78bfa">SD</text>
    <text x="84" y="46" font-size="22" font-weight="700" fill="#f1f5f9">ScholarDive</text>
    <text x="84" y="65" font-size="13" fill="#94a3b8">Adaptive assessment platform, co-builder</text>
    <text x="24" y="108" font-size="13.5" fill="#cbd5e1">Automates grading with semantic NLP scoring and gives</text>
    <text x="24" y="128" font-size="13.5" fill="#cbd5e1">students instant feedback. Live at scholardive.com.</text>
    <rect x="24" y="160" width="67" height="26" rx="13.0" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".38"/><text class="mono" x="57.5" y="177.2" text-anchor="middle" font-size="12" fill="#a78bfa">Python</text>
    <rect x="99" y="160" width="74" height="26" rx="13.0" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".38"/><text class="mono" x="136.0" y="177.2" text-anchor="middle" font-size="12" fill="#a78bfa">FastAPI</text>
    <rect x="181" y="160" width="74" height="26" rx="13.0" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".38"/><text class="mono" x="218.0" y="177.2" text-anchor="middle" font-size="12" fill="#a78bfa">PyTorch</text>
    <rect x="263" y="160" width="60" height="26" rx="13.0" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".38"/><text class="mono" x="293.0" y="177.2" text-anchor="middle" font-size="12" fill="#a78bfa">React</text>
    <rect x="331" y="160" width="74" height="26" rx="13.0" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".38"/><text class="mono" x="368.0" y="177.2" text-anchor="middle" font-size="12" fill="#a78bfa">MongoDB</text>
  </g>
  <rect x=".5" y=".5" width="479" height="211" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity=".10"/>
</svg>
