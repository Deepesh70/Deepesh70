<svg width="480" height="200" viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ScholarDive: Adaptive assessment platform">
  <defs>
    <clipPath id="c1"><rect width="480" height="200" rx="10"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  </style>

  <g clip-path="url(#c1)">
    <rect width="480" height="200" fill="#0d1117"/>
    <rect x="0" y="0" width="480" height="1" fill="#30363d"/>

    <text class="mono" x="24" y="38" font-size="12" font-weight="600" fill="#00BFFF">LIVE PRODUCTION PLATFORM</text>
    <text x="24" y="70" font-size="20" font-weight="600" fill="#f0f6fc">ScholarDive</text>
    <text class="mono" x="160" y="70" font-size="13" fill="#8b949e">scholardive.com</text>

    <text x="24" y="104" font-size="13.5" fill="#8b949e">Automates grading workflows via semantic NLP scoring pipelines</text>
    <text x="24" y="126" font-size="13.5" fill="#8b949e">and real-time student evaluation feedback loops.</text>

    <g transform="translate(24, 152)">
      <rect width="60" height="24" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text class="mono" x="30" y="16" text-anchor="middle" font-size="11" fill="#c9d1d9">React</text>

      <rect x="68" width="68" height="24" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text class="mono" x="102" y="16" text-anchor="middle" font-size="11" fill="#c9d1d9">FastAPI</text>

      <rect x="144" width="68" height="24" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text class="mono" x="178" y="16" text-anchor="middle" font-size="11" fill="#c9d1d9">PyTorch</text>

      <rect x="220" width="76" height="24" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text class="mono" x="258" y="16" text-anchor="middle" font-size="11" fill="#c9d1d9">MongoDB</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="479" height="199" rx="9.5" fill="none" stroke="#30363d" stroke-width="1"/>
