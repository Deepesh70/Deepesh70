<svg width="1000" height="28" viewBox="0 0 1000 28" xmlns="http://www.w3.org/2000/svg" role="presentation">
  <defs>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset=".5" stop-color="#8b5cf6" stop-opacity=".75"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#22d3ee" stop-opacity=".8"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .dot{animation:travel 8s ease-in-out infinite alternate}
    @keyframes travel{from{transform:translateX(0)}to{transform:translateX(700px)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect x="80" y="13" width="840" height="2" rx="1" fill="url(#line)"/>
  <g class="dot"><circle cx="150" cy="14" r="12" fill="url(#glow)"/><circle cx="150" cy="14" r="3" fill="#67e8f9"/></g>
</svg>
