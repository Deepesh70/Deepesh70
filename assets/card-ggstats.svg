<svg width="480" height="200" viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GGStats: Gaming telemetry analytics">
  <defs>
    <clipPath id="c4"><rect width="480" height="200" rx="10"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  </style>

  <g clip-path="url(#c4)">
    <rect width="480" height="200" fill="#0d1117"/>
    <rect x="0" y="0" width="480" height="1" fill="#30363d"/>

    <text class="mono" x="24" y="38" font-size="12" font-weight="600" fill="#22c55e">DISTRIBUTED CACHING</text>
    <text x="24" y="70" font-size="20" font-weight="600" fill="#f0f6fc">GGStats</text>
    <text class="mono" x="120" y="70" font-size="13" fill="#8b949e">Telemetry Platform</text>

    <text x="24" y="104" font-size="13.5" fill="#8b949e">In-memory Redis caching layer fronting third-party APIs to</text>
    <text x="24" y="126" font-size="13.5" fill="#8b949e">eliminate rate limits and accelerate query throughput.</text>

    <g transform="translate(24, 152)">
      <rect width="84" height="24" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text class="mono" x="42" y="16" text-anchor="middle" font-size="11" fill="#c9d1d9">TypeScript</text>

      <rect x="92" width="68" height="24" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text class="mono" x="126" y="16" text-anchor="middle" font-size="11" fill="#c9d1d9">Express</text>

      <rect x="168" width="56" height="24" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text class="mono" x="196" y="16" text-anchor="middle" font-size="11" fill="#c9d1d9">Redis</text>

      <rect x="232" width="60" height="24" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text class="mono" x="262" y="16" text-anchor="middle" font-size="11" fill="#c9d1d9">React</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="479" height="199" rx="9.5" fill="none" stroke="#30363d" stroke-width="1"/>
</svg>
