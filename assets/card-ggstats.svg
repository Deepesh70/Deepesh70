<svg width="480" height="212" viewBox="0 0 480 212" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GGStats: Distributed game telemetry platform">
  <defs>
    <linearGradient id="bgg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1222"/><stop offset="1" stop-color="#141b33"/></linearGradient>
    <linearGradient id="topg3" x1="0" x2="1"><stop offset="0" stop-color="#4ade80" stop-opacity="0"/><stop offset=".5" stop-color="#4ade80"/><stop offset="1" stop-color="#4ade80" stop-opacity="0"/></linearGradient>
    <linearGradient id="swg3" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="cpg3"><rect width="480" height="212" rx="18"/></clipPath>
  </defs>
  <style>
    text{font-family:'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace}
    .sweep{animation:sweep 10s ease-in-out 6s infinite}
    @keyframes sweep{0%{transform:translateX(-220px) skewX(-18deg)}35%,100%{transform:translateX(560px) skewX(-18deg)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#cpg3)">
    <rect width="480" height="212" fill="url(#bgg3)"/>
    <rect width="480" height="3" fill="url(#topg3)"/>
    <rect class="sweep" x="0" y="0" width="150" height="212" fill="url(#swg3)"/>
    <rect x="24" y="26" width="46" height="46" rx="13" fill="#4ade80" fill-opacity=".14" stroke="#4ade80" stroke-opacity=".45"/>
    <text class="mono" x="47" y="55" text-anchor="middle" font-size="16" font-weight="700" fill="#4ade80">GG</text>
    <text x="84" y="46" font-size="22" font-weight="700" fill="#f1f5f9">GGStats</text>
    <text x="84" y="65" font-size="13" fill="#94a3b8">Distributed game telemetry platform</text>
    <text x="24" y="108" font-size="13.5" fill="#cbd5e1">Redis cache in front of third-party APIs to absorb rate</text>
    <text x="24" y="128" font-size="13.5" fill="#cbd5e1">limits while dashboards render player trends in real time.</text>
    <rect x="24" y="160" width="96" height="26" rx="13.0" fill="#4ade80" fill-opacity=".12" stroke="#4ade80" stroke-opacity=".38"/><text class="mono" x="72.0" y="177.2" text-anchor="middle" font-size="12" fill="#4ade80">TypeScript</text>
    <rect x="128" y="160" width="74" height="26" rx="13.0" fill="#4ade80" fill-opacity=".12" stroke="#4ade80" stroke-opacity=".38"/><text class="mono" x="165.0" y="177.2" text-anchor="middle" font-size="12" fill="#4ade80">Express</text>
    <rect x="210" y="160" width="60" height="26" rx="13.0" fill="#4ade80" fill-opacity=".12" stroke="#4ade80" stroke-opacity=".38"/><text class="mono" x="240.0" y="177.2" text-anchor="middle" font-size="12" fill="#4ade80">Redis</text>
    <rect x="278" y="160" width="60" height="26" rx="13.0" fill="#4ade80" fill-opacity=".12" stroke="#4ade80" stroke-opacity=".38"/><text class="mono" x="308.0" y="177.2" text-anchor="middle" font-size="12" fill="#4ade80">React</text>
    <rect x="346" y="160" width="82" height="26" rx="13.0" fill="#4ade80" fill-opacity=".12" stroke="#4ade80" stroke-opacity=".38"/><text class="mono" x="387.0" y="177.2" text-anchor="middle" font-size="12" fill="#4ade80">Tailwind</text>
  </g>
  <rect x=".5" y=".5" width="479" height="211" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity=".10"/>
</svg>
