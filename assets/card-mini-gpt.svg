<svg width="480" height="200" viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mini GPT: Decoder-only transformer">
  <defs>
    <clipPath id="c3"><rect width="480" height="200" rx="10"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  </style>

  <g clip-path="url(#c3)">
    <rect width="480" height="200" fill="#0d1117"/>
    <rect x="0" y="0" width="480" height="1" fill="#30363d"/>

    <text class="mono" x="24" y="38" font-size="12" font-weight="600" fill="#a78bfa">AUTOREGRESSIVE TRANSFORMER</text>
    <text x="24" y="70" font-size="20" font-weight="600" fill="#f0f6fc">Mini GPT</text>
    <text class="mono" x="125" y="70" font-size="13" fill="#8b949e">Built from Scratch</text>

    <text x="24" y="104" font-size="13.5" fill="#8b949e">Multi-head self-attention, positional embeddings, and residual</text>
    <text x="24" y="126" font-size="13.5" fill="#8b949e">layers trained without high-level abstraction frameworks.</text>

    <g transform="translate(24, 152)">
      <rect width="68" height="24" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text class="mono" x="34" y="16" text-anchor="middle" font-size="11" fill="#c9d1d9">Python</text>

      <rect x="76" width="68" height="24" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text class="mono" x="110" y="16" text-anchor="middle" font-size="11" fill="#c9d1d9">PyTorch</text>

      <rect x="152" width="56" height="24" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text class="mono" x="180" y="16" text-anchor="middle" font-size="11" fill="#c9d1d9">CUDA</text>

      <rect x="216" width="94" height="24" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text class="mono" x="263" y="16" text-anchor="middle" font-size="11" fill="#c9d1d9">Transformers</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="479" height="199" rx="9.5" fill="none" stroke="#30363d" stroke-width="1"/>
</svg>
