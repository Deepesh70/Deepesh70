<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Deepesh Dangi — Systems and Applied AI Engineer">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#21262d" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
    <clipPath id="panel"><rect width="1000" height="260" rx="12"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>

  <g clip-path="url(#panel)">
    <!-- Base Graphite Surface -->
    <rect width="1000" height="260" fill="#0d1117"/>
    <rect width="1000" height="260" fill="url(#grid)"/>

    <!-- Subtle Top Hairline Highlight -->
    <rect x="0" y="0" width="1000" height="1" fill="#30363d"/>

    <!-- Header Terminal Prompt Meta -->
    <text class="mono" x="48" y="52" font-size="13" font-weight="500" fill="#8b949e">deepesh@engine-core:~$</text>
    <text class="mono" x="228" y="52" font-size="13" font-weight="400" fill="#00BFFF">./profile --verbose</text>

    <!-- Name and Positioning -->
    <text x="48" y="112" font-size="44" font-weight="600" fill="#f0f6fc" letter-spacing="-0.5">Deepesh Dangi</text>
    <text x="48" y="148" font-size="16" font-weight="400" fill="#8b949e">B.Tech in Computer Science &amp; Engineering · Systems &amp; Applied AI Engineer</text>

    <!-- Direct Focus Line -->
    <text class="mono" x="48" y="196" font-size="13" font-weight="400" fill="#c9d1d9">
      <tspan fill="#8b949e">&gt;</tspan> Co-building <tspan fill="#00BFFF">ScholarDive</tspan> (scholardive.com)
      <tspan dx="20" fill="#8b949e">·</tspan> Author of <tspan fill="#00BFFF">Unreal-MCP</tspan> (C++ Engine RPCs)
    </text>

    <!-- Right-Hand Architecture Spec Block -->
    <g transform="translate(680, 48)">
      <rect width="272" height="164" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text class="mono" x="20" y="32" font-size="12" font-weight="600" fill="#8b949e">SYSTEM METRICS</text>
      <line x1="20" y1="44" x2="252" y2="44" stroke="#21262d" stroke-width="1"/>

      <text class="mono" x="20" y="70" font-size="12" fill="#8b949e">runtime:</text>
      <text class="mono" x="110" y="70" font-size="12" fill="#f0f6fc">C++17 / Native IPC</text>

      <text class="mono" x="20" y="96" font-size="12" fill="#8b949e">pipeline:</text>
      <text class="mono" x="110" y="96" font-size="12" fill="#f0f6fc">PyTorch / FastAPI</text>

      <text class="mono" x="20" y="122" font-size="12" fill="#8b949e">caching:</text>
      <text class="mono" x="110" y="122" font-size="12" fill="#f0f6fc">In-Memory Redis</text>

      <text class="mono" x="20" y="146" font-size="12" fill="#8b949e">status:</text>
      <text class="mono" x="110" y="146" font-size="12" fill="#22c55e">Available for SDE</text>
    </g>
  </g>

  <!-- Quiet Outer Border -->
  <rect x="0.5" y="0.5" width="999" height="259" rx="11.5" fill="none" stroke="#30363d" stroke-width="1"/>
</svg>
