<svg width="1000" height="210" viewBox="0 0 1000 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Deepesh Dangi — Systems and Applied AI Engineer">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#21262d" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
    <clipPath id="panel"><rect width="1000" height="210" rx="10"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>

  <g clip-path="url(#panel)">
    <!-- Base Graphite Surface -->
    <rect width="1000" height="210" fill="#0d1117"/>
    <rect width="1000" height="210" fill="url(#grid)"/>

    <!-- Subtle Top Hairline Highlight -->
    <rect x="0" y="0" width="1000" height="1" fill="#30363d"/>

    <!-- Header Terminal Prompt Meta -->
    <text class="mono" x="48" y="46" font-size="13" font-weight="500" fill="#8b949e">deepesh@engine-core:~$</text>
    <text class="mono" x="228" y="46" font-size="13" font-weight="400" fill="#00BFFF">./profile --verbose</text>

    <!-- Name and Positioning -->
    <text x="48" y="102" font-size="44" font-weight="600" fill="#f0f6fc" letter-spacing="-0.5">Deepesh Dangi</text>
    <text x="48" y="136" font-size="15" font-weight="400" fill="#8b949e">B.Tech in Computer Science &amp; Engineering · Systems &amp; Applied AI Engineer</text>

    <!-- Direct Focus Line -->
    <text class="mono" x="48" y="176" font-size="13" font-weight="400" fill="#c9d1d9">
      <tspan fill="#8b949e">&gt;</tspan> Co-building <tspan fill="#00BFFF">ScholarDive</tspan> (scholardive.com)
      <tspan dx="20" fill="#8b949e">·</tspan> Author of <tspan fill="#00BFFF">Unreal-MCP</tspan> (C++ Engine RPCs)
      <tspan dx="20" fill="#8b949e">·</tspan> <tspan fill="#7ee787">Available for SDE Internships</tspan>
    </text>
  </g>

  <!-- Quiet Outer Border -->
  <rect x="0.5" y="0.5" width="999" height="209" rx="9.5" fill="none" stroke="#30363d" stroke-width="1"/>
</svg>