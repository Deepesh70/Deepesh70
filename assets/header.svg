<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Deepesh Dangi, software engineer working on low-latency systems, applied AI and distributed backends">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/><stop offset="1" stop-color="#160f33"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1f5f9"/><stop offset=".55" stop-color="#c4b5fd"/><stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".30"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".30"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".16"/><stop offset="1" stop-color="#8b5cf6" stop-opacity=".16"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="45"/></filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#ffffff" opacity=".07"/></pattern>
    <clipPath id="clip"><rect width="1000" height="320" rx="22"/></clipPath>
  </defs>
  <style>
    text{font-family:'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif}
    .mono{font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace}
    .rise{animation:rise 1.1s cubic-bezier(.2,.7,.2,1) both}
    .rise2{animation:rise 1.1s .18s cubic-bezier(.2,.7,.2,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .tag{opacity:0;animation:cycle 12s infinite backwards}
    .t2{animation-delay:4s} .t3{animation-delay:8s}
    @keyframes cycle{0%{opacity:0;transform:translateY(8px)}4%{opacity:1;transform:translateY(0)}29%{opacity:1;transform:translateY(0)}33%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}
    .o{animation:float 16s ease-in-out infinite alternate}
    .o2{animation-duration:21s;animation-direction:alternate-reverse}
    .o3{animation-duration:26s}
    @keyframes float{to{transform:translate(46px,26px)}}
    .spin{transform-origin:820px 160px;animation:spin 48s linear infinite}
    .spin-r{transform-origin:820px 160px;animation:spin 70s linear infinite reverse}
    @keyframes spin{to{transform:rotate(360deg)}}
    .core{transform-box:fill-box;transform-origin:center;animation:breathe 5s ease-in-out infinite}
    @keyframes breathe{50%{transform:scale(1.07)}}
    .w1{animation:wave 16s linear infinite}
    .w2{animation:wave 26s linear infinite}
    @keyframes wave{to{transform:translateX(-500px)}}
    .ping{transform-box:fill-box;transform-origin:center;animation:ping 2.6s ease-out infinite}
    @keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    @media (prefers-reduced-motion: reduce){.tag{opacity:0} .t1{opacity:1}}
  </style>

  <g clip-path="url(#clip)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#dots)"/>

    <g filter="url(#blur)">
      <circle class="o" cx="170" cy="70" r="120" fill="#7c3aed" opacity=".45"/>
      <circle class="o o2" cx="860" cy="240" r="140" fill="#0891b2" opacity=".35"/>
      <circle class="o o3" cx="520" cy="320" r="110" fill="#db2777" opacity=".16"/>
    </g>

    <g class="spin-r" fill="none">
      <circle cx="820" cy="160" r="132" stroke="#8b5cf6" stroke-opacity=".35" stroke-dasharray="2 9" stroke-linecap="round"/>
      <circle cx="952" cy="160" r="5" fill="#a78bfa"/>
    </g>
    <g class="spin" fill="none">
      <circle cx="820" cy="160" r="94" stroke="#22d3ee" stroke-opacity=".45" stroke-dasharray="26 10"/>
      <circle cx="820" cy="66" r="5" fill="#67e8f9"/>
    </g>
    <g class="spin-r" fill="none">
      <circle cx="820" cy="160" r="58" stroke="#f472b6" stroke-opacity=".4" stroke-dasharray="4 8" stroke-linecap="round"/>
      <circle cx="762" cy="160" r="4" fill="#f9a8d4"/>
    </g>
    <g class="core">
      <circle cx="820" cy="160" r="34" fill="url(#core)" opacity=".9"/>
      <circle cx="820" cy="160" r="34" fill="none" stroke="#ffffff" stroke-opacity=".25"/>
      <text class="mono" x="820" y="168" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">&lt;/&gt;</text>
    </g>

    <g class="rise">
      <text x="64" y="96" font-size="16" fill="#94a3b8">B.Tech, Computer Science &amp; Engineering</text>
      <text x="62" y="162" font-size="70" font-weight="800" letter-spacing="-2" fill="url(#name)">Deepesh Dangi</text>
    </g>

    <g class="rise2">
      <text class="mono tag t1" x="64" y="208" font-size="21" fill="#e2e8f0">Low-latency systems in C++</text>
      <text class="mono tag t2" x="64" y="208" font-size="21" fill="#e2e8f0">Applied AI pipelines in PyTorch</text>
      <text class="mono tag t3" x="64" y="208" font-size="21" fill="#e2e8f0">Distributed backends with FastAPI and Redis</text>

      <rect x="64" y="236" width="244" height="36" rx="18" fill="#22c55e" fill-opacity=".10" stroke="#22c55e" stroke-opacity=".38"/>
      <circle class="ping" cx="86" cy="254" r="4" fill="#4ade80"/>
      <circle cx="86" cy="254" r="4" fill="#4ade80"/>
      <text x="102" y="259" font-size="14" fill="#bbf7d0">Open to SDE internships</text>
    </g>

    <g class="w2"><path d="M0 292 Q125 262 250 292 T500 292 T750 292 T1000 292 T1250 292 T1500 292 V330 H0 Z" fill="url(#waveB)"/></g>
    <g class="w1"><path d="M0 300 Q125 274 250 300 T500 300 T750 300 T1000 300 T1250 300 T1500 300 V330 H0 Z" fill="url(#waveA)"/></g>
  </g>
  <rect x=".5" y=".5" width="999" height="319" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity=".09"/>
</svg>
