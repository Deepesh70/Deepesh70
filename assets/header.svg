<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.7" />
    </pattern>
  </defs>

  <style>
    .title { font: 700 34px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, sans-serif; fill: #F8FAFC; letter-spacing: -0.5px; }
    .subtitle { font: 500 14px 'JetBrains Mono', 'Fira Code', monospace; fill: #38BDF8; letter-spacing: 0.5px; }
    .desc { font: 400 14px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; fill: #94A3B8; }
    .tag { font: 600 11px 'JetBrains Mono', monospace; fill: #E2E8F0; }
    .node { fill: #38BDF8; animation: pulse 3.5s infinite ease-in-out; }
    .node-delay { fill: #818CF8; animation: pulse 3.5s infinite ease-in-out 1.75s; }
    .line-flow { stroke: url(#accent); stroke-width: 1.5; stroke-dasharray: 8 6; animation: dash 12s linear infinite; opacity: 0.45; }
    .fade-1 { opacity: 0; animation: fadeIn 0.8s ease-out forwards 0.1s; }
    .fade-2 { opacity: 0; animation: fadeIn 0.8s ease-out forwards 0.3s; }
    .fade-3 { opacity: 0; animation: fadeIn 0.8s ease-out forwards 0.5s; }

    @keyframes pulse {
      0%, 100% { r: 3.5px; opacity: 0.4; }
      50% { r: 6px; opacity: 1; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -140; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <!-- Background & Grid -->
  <rect width="900" height="220" rx="14" fill="url(#bg)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="900" height="220" rx="14" fill="url(#grid)" />
  <rect width="900" height="220" rx="14" fill="url(#glow)" />

  <!-- Animated System Topology Graphic (Right Side) -->
  <g transform="translate(580, 30)">
    <path class="line-flow" d="M20,40 L120,25 L220,75 L150,140 L40,120 Z" fill="none" />
    <path class="line-flow" d="M120,25 L150,140 M20,40 L220,75" fill="none" />
    <circle class="node" cx="20" cy="40" r="4" />
    <circle class="node-delay" cx="120" cy="25" r="4" />
    <circle class="node" cx="220" cy="75" r="4" />
    <circle class="node-delay" cx="150" cy="140" r="4" />
    <circle class="node" cx="40" cy="120" r="4" />
  </g>

  <!-- Content -->
  <g transform="translate(45, 58)">
    <text class="subtitle fade-1" x="0" y="0">>_ SYSTEMS ENGINEERING · APPLIED AI · BACKEND ARCHITECTURE</text>
    <text class="title fade-2" x="0" y="42">Deepesh Dangi</text>
    <text class="desc fade-3" x="0" y="76">Building native C++ engine integrations, autoregressive ML pipelines, and high-concurrency</text>
    <text class="desc fade-3" x="0" y="98">backend systems. Focused on deterministic boundaries and low-overhead IPC.</text>

    <!-- Status Pill -->
    <g class="fade-3" transform="translate(0, 118)">
      <rect width="335" height="26" rx="13" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#10B981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text class="tag" x="26" y="17">OPEN TO SDE INTERNSHIPS & APPLIED AI ROLES</text>
    </g>
  </g>
</svg>